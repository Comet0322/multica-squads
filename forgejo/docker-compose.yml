name: forgejo
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__ROOT_URL: http://localhost:13000/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      # Multica runs on the same host/network, so webhooks must be allowed to reach private addresses.
      FORGEJO__webhook__ALLOWED_HOST_LIST: "*"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - forgejo-data:/data
    networks:
      - default
      - multica
volumes:
  forgejo-data:
networks:
  multica:
    external: true
    name: multica_default
