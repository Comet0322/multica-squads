# multica-platform-apifox — no token / no project secret
version: "1.0"

api_base_url: "https://apifox.example.com"

apifox:
  out_dir: "./apifox-reports"
  default_reporters: "cli,html,json"
  upload_report: true
  env_vars:
    - "baseUrl={{base_url}}"

defaults:
  environment_id: ""

# Issue prefix -> default scenario (T3 run_apifox.py)
issue_scenario_map:
  AAI:
    scenario_id: ""
    environment_id: ""
    test_suite_id: ""

# Issue prefix -> Apifox project (for OpenAPI sync, set APIFOX_PROJECT_ID or fill it in here)
issue_project_map:
  AAI:
    project_id: ""

# Default branch for OpenAPI sync
import:
  branch: "main"
  delete_orphans: true   # only delete endpoints that carry --tag and are not in this OpenAPI
